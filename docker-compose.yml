# ============================================
# Tissés de Waraniéné - Docker Compose
# ============================================

services:
  # --- Application Next.js ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waraniene-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_TYPE=mysql
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=waraniene
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-waraniene_secret}
      - MYSQL_DATABASE=waraniene_db
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - NEXT_PUBLIC_SITE_URL=${SITE_URL:-http://localhost:3000}
      - NEXT_PUBLIC_KKIAPAY_PUBLIC_KEY=${KKIAPAY_PUBLIC_KEY:-}
      - NEXT_PUBLIC_KKIAPAY_SANDBOX=${KKIAPAY_SANDBOX:-true}
      - UPLOAD_DIR=public/uploads
      - MAX_FILE_SIZE=5242880
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - waraniene-net

  # --- Base de données MySQL ---
  db:
    image: mysql:8.0
    container_name: waraniene-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_secret}
      - MYSQL_DATABASE=waraniene_db
      - MYSQL_USER=waraniene
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-waraniene_secret}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - waraniene-net

volumes:
  mysql_data:
    driver: local
  uploads:
    driver: local

networks:
  waraniene-net:
    driver: bridge
